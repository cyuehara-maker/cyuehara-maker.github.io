<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Autenticación Básico</title>
</head>

<body>
    <form action="https://lm.ciclo.iesnervion.es/form_login.php." method="post">
        <label for="usuario">Nombre de usuario o Email</label>
        <input name="usuario" id="usuario" type="text" placeholder="usuario@dominio.com" required>
        <br><br>
        <label for="password">Contraseña</label>
        <input name="password" id="password" type="password" required>
        <br><br>
        <label for="recordar">Recordar sesión</label>
        <input name="recordar" id="recordar" type="checkbox">
        <br><br>
        <button type="submit">Iniciar Sesión</button>
    </form>
</body>

</html>
