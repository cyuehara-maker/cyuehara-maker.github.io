<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Encuesta de Preferencias de Desarrollo</title>
</head>

<body>
    <form action="https://lm.ciclo.iesnervion.es/encuesta.php" method="post">
        <fieldset>
            <legend>Datos Académicos</legend>

            <label for="nombre">Nombre y Apellidos:</label>
            <input type="text" name="nombre" id="nombre" required>
            <br><br>

            <label for="ciclo">Ciclo Formativo</label>
            <select name="ciclo" id="ciclo">
                <option value="dam" selected>DAM</option>
                <option value="daw">DAW</option>
                <option value="asir">ASIR</option>
            </select>

        </fieldset>
        <fieldset>
            <legend>Preferencias Técnicas</legend>

            <p>Lenguaje principal</p>
            <input type="radio" name="lenguaje" id="java" value="java">
            <label for="java">Java</label><br>
            <input type="radio" name="lenguaje" id="python" value="python">
            <label for="python">Python</label><br>
            <input type="radio" name="lenguaje" id="c#" value="c#">
            <label for="c#">C#</label><br>
            <input type="radio" name="lenguaje" id="javascript" value="javascript">
            <label for="javascript">JavaScript</label><br>
            
            <p>Entornos de trabajo habituales</p>
            <input type="checkbox" name="entornos" id="linux" value="linux">
            <label for="linux">Linux</label><br>
            <input type="checkbox" name="entornos" id="windows" value="windows">
            <label for="windows">Windows</label><br>
            <input type="checkbox" name="entornos" id="macos" value="macos">
            <label for="macos">MacOS</label><br><br>

            <label for="comentarios">Comentarios / Experiencia previa</label><br>
            <textarea name="comentarios" id="comentarios" rows="4" cols="40"></textarea>;

        </fieldset><br>
        
        <button type="reset">Restablecer</button>
        <button type="submit">Enviar</button>

    </form>
</body>

</html>
